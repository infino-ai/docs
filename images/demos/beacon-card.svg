<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Beacon demo">
  <rect width="640" height="360" fill="#131410"/>
  <!-- faint plotting grid -->
  <g stroke="#1e2019" stroke-width="1">
    <path d="M0 90 H640 M0 180 H640 M0 270 H640"/>
    <path d="M160 0 V360 M320 0 V360 M480 0 V360"/>
  </g>
  <!-- ground -->
  <line x1="60" y1="300" x2="580" y2="300" stroke="#272921" stroke-width="2"/>
  <!-- tower: tapered mast + housing -->
  <path d="M138 300 L148 150 h8 L166 300 z" fill="none" stroke="#9a9d92" stroke-width="2"/>
  <line x1="141" y1="250" x2="163" y2="250" stroke="#9a9d92" stroke-width="1.5"/>
  <line x1="144" y1="200" x2="160" y2="200" stroke="#9a9d92" stroke-width="1.5"/>
  <rect x="142" y="128" width="20" height="22" fill="none" stroke="#9a9d92" stroke-width="2"/>
  <!-- lamp -->
  <circle cx="152" cy="139" r="14" fill="#ffb84d" opacity="0.16"/>
  <circle cx="152" cy="139" r="6" fill="#ffb84d"/>
  <!-- sweeping beam -->
  <path d="M162 132 L560 196 L560 262 L162 148 Z" fill="#ffb84d" opacity="0.07"/>
  <!-- log-volume bars: lit inside the beam, dim outside -->
  <g stroke-width="14" stroke-linecap="butt">
    <line x1="272" y1="300" x2="272" y2="262" stroke="#ffb84d" opacity="0.5"/>
    <line x1="304" y1="300" x2="304" y2="248" stroke="#ffb84d" opacity="0.45"/>
    <line x1="336" y1="300" x2="336" y2="270" stroke="#ffb84d" opacity="0.5"/>
    <line x1="368" y1="300" x2="368" y2="232" stroke="#ffb84d" opacity="0.4"/>
    <line x1="400" y1="300" x2="400" y2="256" stroke="#ffb84d" opacity="0.45"/>
    <line x1="432" y1="300" x2="432" y2="222" stroke="#ffb84d" opacity="0.38"/>
    <line x1="464" y1="300" x2="464" y2="266" stroke="#ffb84d" opacity="0.42"/>
    <line x1="496" y1="300" x2="496" y2="240" stroke="#ffb84d" opacity="0.35"/>
    <!-- beyond the beam -->
    <line x1="544" y1="300" x2="544" y2="258" stroke="#272921"/>
    <line x1="576" y1="300" x2="576" y2="276" stroke="#272921"/>
    <line x1="96" y1="300" x2="96" y2="272" stroke="#272921"/>
  </g>
</svg>
